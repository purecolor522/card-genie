<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <pattern id="halftone" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1" fill="#FFFFFF" opacity="0.18"/>
    </pattern>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C76A"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#8E6F32"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
  </defs>

  <!-- 米奶白 PWA 安全底 -->
  <rect width="512" height="512" fill="#F4F2EC"/>

  <!-- 卡片本體（直放，安全區內） -->
  <g>
    <!-- 陰影 -->
    <rect x="48" y="118" width="416" height="278" rx="26" fill="#0A0A0A" opacity="0.10"/>
    <!-- 卡身 -->
    <rect x="44" y="112" width="416" height="278" rx="26" fill="url(#cardGrad)"/>
    <!-- 半色調點陣 -->
    <rect x="44" y="112" width="416" height="278" rx="26" fill="url(#halftone)"/>
    <!-- 細白框 -->
    <rect x="44" y="112" width="416" height="278" rx="26" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.18"/>

    <!-- 金色晶片 -->
    <rect x="86" y="160" width="84" height="64" rx="9" fill="url(#chipGrad)"/>
    <path d="M86 192 L170 192 M128 160 L128 224 M86 175 L98 175 L98 209 L86 209 M170 175 L158 175 L158 209 L170 209"
          stroke="#5C4720" stroke-width="1.4" fill="none" opacity="0.55"/>

    <!-- NFC 感應圖示 -->
    <g transform="translate(196 168)" stroke="#FFFFFF" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.85">
      <path d="M 0 0 Q 10 24 0 48"/>
      <path d="M 12 -6 Q 26 24 12 54"/>
      <path d="M 24 -12 Q 42 24 24 60"/>
    </g>

    <!-- 卡號（圓點＋年份） -->
    <text x="86" y="290" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="700"
          fill="#FFFFFF" letter-spacing="6" opacity="0.55">••••  ••••  2026</text>

    <!-- 持卡人 / 品牌 -->
    <text x="86" y="356" font-family="Inter, -apple-system, sans-serif" font-size="34" font-weight="900"
          fill="#FFFFFF" letter-spacing="3">CARD GENIE</text>

    <!-- Mastercard 風雙圈 -->
    <g transform="translate(386 332)">
      <circle cx="0" cy="0" r="30" fill="#FFFFFF" opacity="0.92"/>
      <circle cx="36" cy="0" r="30" fill="#FFFFFF" opacity="0.55"/>
    </g>
  </g>

  <!-- 底部品牌副標 -->
  <text x="256" y="466" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700"
        fill="#0A0A0A" text-anchor="middle" letter-spacing="5" opacity="0.55">INFO · CASH · CHOICE</text>
</svg>
